
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brain-tasks
  template:
    metadata:
      labels:
        app: brain-tasks
    spec:
      containers:
        - name: brain-tasks
          image: 353452028567.dkr.ecr.ap-southeast-2.amazonaws.com/brain-tasks-app:v1
          ports:
            - containerPort: 80

